# Nightly smoke tests against real provider APIs. Not run on pull requests.
name: nightly-live

on:
  schedule:
    - cron: "43 3 * * *" # daily 03:43 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: live
    runs-on: ubuntu-latest
    env:
      API_USGS_PAT: ${{ secrets.API_USGS_PAT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[all,test]"
      - run: pytest -m live
